<!DOCTYPE html>
<!--
  Zero-install Ketcher launcher — loads ketcher-react v3.12.0 from a
  public CDN. Drop this file open in any modern browser; no Node, no
  build, no backend required. First load fetches ~5 MB of JS from
  unpkg, after which it works offline.

  For a fully-offline build (no CDN dep), run `bash deps/build_ketcher.sh`
  to produce deps/ketcher/install/index.html from the vendored source.

  Usage:
    1. xdg-open tools/ketcher.html       (or just double-click)
    2. Draw your reactant / product / TS guess
    3. Click "Get SMILES" or "Save as MOL/RXN"
    4. Paste the string into a qcb workflow (RDKit / autode / orca / …)
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ketcher (qcb local launcher)</title>
  <link rel="stylesheet" href="https://unpkg.com/ketcher-react@3.12.0/dist/index.css">
  <style>
    body, html { margin: 0; height: 100%; font-family: system-ui, sans-serif; }
    #root { height: 100vh; }
    .header { padding: 6px 12px; background: #f5f5f5; border-bottom: 1px solid #ddd; font-size: 12px; }
  </style>
</head>
<body>
  <div class="header">Ketcher 3.12.0 (loaded from unpkg CDN). For offline: <code>bash deps/build_ketcher.sh</code></div>
  <div id="root"></div>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/ketcher-react@3.12.0/dist/index.js"></script>
  <script crossorigin src="https://unpkg.com/ketcher-standalone@3.12.0/dist/index.js"></script>
  <script>
    const { Editor } = ketcherReact;
    const struct = new ketcherStandalone.StandaloneStructServiceProvider();
    ReactDOM.createRoot(document.getElementById("root")).render(
      React.createElement(Editor, {
        staticResourcesUrl: "",
        structServiceProvider: struct,
        errorHandler: console.error,
      })
    );
  </script>
</body>
</html>
