[project]
name = "quantum-engine"
version = "0.2.0"
description = "Quantum engine for enzyme design — modular tools for active-site prep, MD/metadynamics, MLFF NEB/IRC/TS, and FES analysis. Composable into multi-step orchestrator pipelines."
authors = [
    { name = "Seth M. Woodbury", email = "woodbuse@uw.edu" },
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "matplotlib>=3.7",
    "biotite>=0.40",
    "scipy>=1.11",
]

[project.optional-dependencies]
mlff = ["ase>=3.23", "mace-torch>=0.3.10", "sella>=2.3"]
qm = ["ase>=3.23"]
analysis = ["scikit-image>=0.22", "pandas>=2.0"]
# Chemistry workflow tools (drawing → mapping → 2D-3D → conformers → profile).
# These are pip-installable; the heavyweight binaries (CREST, ChemShell) are
# vendored as git submodules under deps/ — see deps/README.md.
chem = [
    "rdkit>=2024.03",          # 2D / 3D / format / bond-diff / ETKDGv3
    "epam.indigo>=1.27",       # 2nd format+stereo backend (cross-validate vs RDKit)
    "rxnmapper>=0.4",          # transformer-based atom mapping
    "CGRtools>=4.1",           # bond-change / reaction-graph diff
    "autode>=1.4",             # SMILES → reaction profile (defaults to xtb / ORCA)
]
# SCINE Chemoton + ReaDuct (separate group — heavy + Linux-64 wheels only).
# Installed by deps/build_scine.sh; pinned here too for editable installs.
# Submodules at deps/scine_chemoton + deps/scine_readuct are source-of-truth
# tracking only.
scine = [
    "scine-chemoton==4.1.0",
    "scine-readuct==6.1.0",
    "scine-sparrow==5.1.0",
]
# Path-search engines vendored under deps/ (pip-editable installs):
#   pip install -e deps/pyGSM
#   pip install -e deps/pysisyphus
# molecularGSM is CMake/MKL source build — see deps/build_molecular_gsm.sh.
opt = ["pysisyphus>=0.7"]
# Everything except cuda-only MLFF stuff.
all = ["ase>=3.23", "mace-torch>=0.3.10", "sella>=2.3", "biotite>=0.40",
       "scikit-image>=0.22", "pandas>=2.0",
       "rdkit>=2024.03", "epam.indigo>=1.27", "rxnmapper>=0.4",
       "CGRtools>=4.1", "autode>=1.4",
       "scine-chemoton==4.1.0", "scine-readuct==6.1.0", "scine-sparrow==5.1.0",
       "pysisyphus>=0.7"]

[project.scripts]
# CLI binary stays `qcb` for backwards compatibility / habit; package is
# `quantum_engine`. `pip install -e .` puts qcb on PATH.
qcb = "quantum_engine.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["quantum_engine*", "enz_qc_pipelines*"]

[tool.ruff]
lint.select = ["I", "UP", "F", "E", "W"]
lint.ignore = ["E501"]
